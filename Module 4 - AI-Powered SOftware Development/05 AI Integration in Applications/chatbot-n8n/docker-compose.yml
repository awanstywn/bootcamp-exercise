services:
  # ─────────────────────────────────────────
  # PostgreSQL with pgvector extension
  # Custom image that pre-installs pgvector
  # ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      # Persistent data storage
      - postgres_data:/var/lib/postgresql/data
      # Initialization script executed automatically on first container creation
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # n8n — Workflow Automation (our backend)
  # ─────────────────────────────────────────
  n8n:
    image: n8nio/n8n:1.94.1    # Pin stable version
    container_name: chatbot_n8n
    restart: unless-stopped
    environment:
      # Auth for accessing the n8n dashboard
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}

      # n8n connection to PostgreSQL (to store n8n internal data)
      # n8n uses schema "n8n" -> does not conflict with our app tables
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=n8n

      # Network config
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # WEBHOOK_URL is the base URL used by n8n to generate webhook links
      # To use Telegram Trigger locally, you must provide a public HTTPS URL (via ngrok)
      # or comment this out and enable N8N_TUNNEL=true below.
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      # Set N8N_TUNNEL=true for n8n to automatically generate a secure HTTPS tunnel URL.
      # If using N8N_TUNNEL, please COMMENT OUT the WEBHOOK_URL line above.
      # - N8N_TUNNEL=true

      # Timezone Indonesia
      - GENERIC_TIMEZONE=Asia/Jakarta

      # Key to encrypt credentials in n8n
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./uploads:/home/node/.n8n/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:

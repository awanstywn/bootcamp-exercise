<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- DNS / connection hints for 3rd-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://randomuser.me" />
    <link rel="preconnect" href="https://api.backendless.com" />

    <!-- Inter font — display=swap prevents FOIT -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Default meta tags (overridden per-page by react-helmet-async) -->
    <title>PayStream — Modern Payment Infrastructure</title>
    <meta
      name="description"
      content="Modern payment infrastructure for the internet. Trusted by thousands of businesses worldwide."
    />
    <meta name="theme-color" content="#635bff" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PayStream — Modern Payment Infrastructure" />
    <meta
      property="og:description"
      content="Payments, billing, and financial automation for the internet economy."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

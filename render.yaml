services:
  - type: redis
    name: blog-redis
    plan: free
    ipAllowList: []

  - type: web
    name: blog-api
    env: node
    plan: free
    rootDir: "Module5-AdvancedSoftwareDevelopment/06 Asynchronous Processing and Realtime Communication/blog-app-1.5/server"
    buildCommand: npm install && npm run build
    startCommand: npm run start:docker
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: REDIS_URL
        fromService:
          type: redis
          name: blog-redis
          property: connectionString
      - key: CLIENT_URL
        value: "https://awanstywn.github.io"
      - key: SERVER_URL
        value: "https://blog-api.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
